<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTS Attendance System 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1f44;--navy2:#13306b;--blue:#2563eb;--sky:#e8f0fe;--line:#dbe4f3;--ink:#0f1b33;--mut:#64748b;--ok:#0f9d58;--bad:#d93025;--bg:#f4f7fc}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
button,input,select{font:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--navy),var(--navy2) 60%,var(--blue));padding:20px}
.lbox{background:#fff;border-radius:22px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 30px 60px #0006}
.lbox h1{font-size:26px;color:var(--navy);line-height:1.15;margin:6px 0 4px}
.lbox p{color:var(--mut);font-size:13px;margin-bottom:20px}
.tag{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #2563eb22}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.btn.full{width:100%;margin-top:18px}.btn.alt{background:var(--sky);color:var(--navy2)}.btn.red{background:#fdecea;color:var(--bad)}.btn.sm{padding:8px 12px;font-size:13px}
.btn.green{background:var(--ok)}
.btn:disabled{opacity:.5}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 22px;border-radius:0 0 26px 26px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;max-width:960px;margin:auto}
header .tag{color:#9db8ff}header h1{font-size:21px}header small{color:#b9c9ee;font-size:12px}
.lock{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#ffffff22}
main{max-width:960px;margin:-12px auto 0;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.st b{display:block;font-family:Fraunces,serif;font-size:30px;color:var(--navy)}.st span{font-size:12px;color:var(--mut)}
.st.hero{background:var(--navy);color:#fff;border:0}.st.hero b{color:#fff}.st.hero span{color:#9db8ff}
.bar{height:8px;background:var(--sky);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#60a5fa)}
.cgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.ci{padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:#fff;text-align:left}
.ci:hover{border-color:var(--blue)}.ci div{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.ci em{font-style:normal;color:var(--mut);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy2)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .n{flex:1;min-width:0}.row .n b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}.row .n small{color:var(--mut);font-size:12px}
.ok{color:var(--ok);font-weight:700;font-size:12px;text-align:right}
.hadir{background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
nav button{flex:1;max-width:160px;border:0;background:none;padding:8px 4px;font-size:12px;font-weight:700;color:var(--mut);border-radius:12px;cursor:pointer}
nav button.on{background:var(--sky);color:var(--blue)}
.g3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.flex{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:9;max-width:90%}
h2{font-size:18px;color:var(--navy);margin-bottom:8px}.mut{color:var(--mut);font-size:12px}
</style>
</head>
<body>

<section id="login" class="hide">
  <div class="lbox">
    <div class="tag">SMK KI HAJAR DEWANTORO</div>
    <h1>BTS Attendance System 2026</h1>
    <p>Khusus panitia. Masuk dengan akun admin bersama.</p>
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn full" id="lg">Masuk</button>
    <p id="lerr" style="color:var(--bad);margin:10px 0 0"></p>
  </div>
</section>

<div id="app" class="hide">
  <header><div class="hrow">
    <div><div class="tag">BTS ATTENDANCE SYSTEM 2026</div><h1>SMK Ki Hajar Dewantoro</h1><small id="tg"></small><br><span class="lock" id="lk"></span></div>
    <button class="btn alt sm" id="out">Keluar</button>
  </div></header>
  <main id="v"></main>
  <nav>
    <button data-v="dash">Dashboard</button><button data-v="abs">Absensi</button>
    <button data-v="lap">Laporan</button><button data-v="set">Pengaturan</button>
  </nav>
</div>
<div id="toast" class="hide"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* ISI dari Firebase Console > Project settings > Web app. Ini config publik, bukan rahasia. */
const firebaseConfig={apiKey:"AIzaSyC3DNAlF8mp0zDQu1__RFf25Q8qlxwM480",authDomain:"absen-siswa-43aab.firebaseapp.com",projectId:"absen-siswa-43aab",appId:"1:553850496451:web:8e8dfa56d898753846c976"};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
const evRef=db.collection('pengaturan').doc('acara'),$=s=>document.querySelector(s);
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let S=[],ev={d:1,m:1,y:2026,terkunci:false},view='dash',kls='',q='',sq='',lapK='',unsub=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nat=(a,b)=>a.localeCompare(b,'id',{numeric:true});
const jam=t=>t&&t.toDate?t.toDate().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'-';
const tgl=()=>`${ev.d} ${BLN[ev.m-1]} ${ev.y}`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),2600)}
const classes=()=>[...new Set(S.map(s=>s.kelas))].sort(nat);
const stat=l=>{const t=l.length,h=l.filter(s=>s.hadir).length;return{t,h,b:t-h,p:t?Math.round(h/t*100):0}};

/* AUTH */
$('#lg').onclick=async()=>{$('#lerr').textContent='';try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(e){$('#lerr').textContent='Email atau password salah.'}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lg').click()};
$('#out').onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{
  unsub.forEach(f=>f());unsub=[];
  $('#login').classList.toggle('hide',!!u);$('#app').classList.toggle('hide',!u);
  if(!u)return;
  unsub.push(db.collection('siswa').onSnapshot(s=>{S=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast('Gagal sinkron: '+e.code)));
  unsub.push(evRef.onSnapshot(d=>{if(d.exists)ev={...ev,...d.data()};else evRef.set({d:ev.d,m:ev.m,y:ev.y,terkunci:false});render()}));
  render();
});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});

/* ABSENSI */
async function hadir(id){
  if(ev.terkunci)return toast('Absensi terkunci');
  const ref=db.collection('siswa').doc(id);
  try{
    await db.runTransaction(async t=>{
      const d=await t.get(ref);
      if(!d.exists)throw new Error('Data tidak ada');
      if(d.data().hadir)throw new Error('DUP');
      t.update(ref,{hadir:true,jam:TS(),oleh:auth.currentUser.email});
    });
    toast('Hadir tercatat ✓');
  }catch(e){toast(e.message==='DUP'?'Sudah diabsen (panitia lain)':'Gagal: '+e.message)}
}
async function batal(id){
  if(ev.terkunci)return toast('Absensi terkunci');
  if(!confirm('Batalkan kehadiran siswa ini?'))return;
  await db.collection('siswa').doc(id).update({hadir:false,jam:null,oleh:null});toast('Absensi dibatalkan');
}

/* VIEWS */
function render(){
  if(!auth.currentUser)return;
  $('#tg').textContent='Acara: '+tgl();
  $('#lk').textContent=ev.terkunci?'🔒 Absensi terkunci':'● Absensi dibuka';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const a=document.activeElement,keep=a&&a.id&&a.tagName==='INPUT'?[a.id,a.selectionStart]:null;
  $('#v').innerHTML={dash:vDash,abs:vAbs,lap:vLap,set:vSet}[view]();
  if(keep){const e=document.getElementById(keep[0]);if(e){e.focus();try{e.setSelectionRange(keep[1],keep[1])}catch(_){}}}
}
function vDash(){
  const s=stat(S);
  return `<div class="stats">
   <div class="st hero"><b>${s.p}%</b><span>Persentase kehadiran</span></div>
   <div class="st"><b>${s.t}</b><span>Total siswa</span></div>
   <div class="st"><b style="color:var(--ok)">${s.h}</b><span>Hadir</span></div>
   <div class="st"><b style="color:var(--bad)">${s.b}</b><span>Belum hadir</span></div></div>
   <div class="card"><h2>Statistik per kelas</h2>${S.length?`<div class="cgrid">${classes().map(k=>{const x=stat(S.filter(i=>i.kelas===k));
   return `<button class="ci" onclick="go('${esc(k)}')"><div>${esc(k)}<em>${x.h}/${x.t}</em></div><div class="bar"><i style="width:${x.p}%"></i></div></button>`}).join('')}</div>`:'<p class="mut">Belum ada data siswa. Impor di menu Pengaturan.</p>'}</div>`;
}
window.go=k=>{kls=k;view='abs';render()};
function vAbs(){
  const cs=classes();let l=S;
  if(kls)l=l.filter(s=>s.kelas===kls);
  if(q)l=l.filter(s=>s.nama.toLowerCase().includes(q.toLowerCase()));
  l=[...l].sort((a,b)=>nat(a.nama,b.nama));
  const more=!kls&&!q?0:Math.max(0,l.length-150);
  const show=!kls&&!q?[]:l.slice(0,150);
  return `<div class="card"><h2>Absensi</h2>
   <div class="chips"><button class="chip ${kls?'':'on'}" onclick="go('')">Semua</button>${cs.map(k=>`<button class="chip ${kls===k?'on':''}" onclick="go('${esc(k)}')">${esc(k)}</button>`).join('')}</div>
   <input id="q" placeholder="Cari nama siswa…" value="${esc(q)}" oninput="q=this.value;render()">
   ${kls?`<p class="mut" style="margin-top:8px">${esc(kls)} · ${stat(S.filter(s=>s.kelas===kls)).h}/${S.filter(s=>s.kelas===kls).length} hadir</p>`:''}
   <div style="margin-top:6px">${show.map(s=>`<div class="row"><div class="n"><b>${esc(s.nama)}</b><small>${esc(s.kelas)}</small></div>
     ${s.hadir?`<div class="ok">✓ Hadir<br><span class="mut">${jam(s.jam)}</span></div>`:`<button class="btn hadir sm" ${ev.terkunci?'disabled':''} onclick="hadir('${s.id}')">HADIR</button>`}</div>`).join('')
     ||`<p class="mut" style="padding:14px 0">${!kls&&!q?'Pilih kelas atau ketik nama siswa.':'Tidak ada siswa ditemukan.'}</p>`}
   ${more?`<p class="mut">+${more} lagi, persempit pencarian.</p>`:''}</div></div>`;
}

/* LAPORAN */
function rows(){return [...S].sort((a,b)=>nat(a.kelas,b.kelas)||nat(a.nama,b.nama))}
const ofKelas=k=>S.filter(s=>s.kelas===k).sort((a,b)=>nat(a.nama,b.nama));
const rowsOf=l=>l.map((s,i)=>({No:i+1,Kelas:s.kelas,Nama:s.nama,Status:s.hadir?'Hadir':'Belum hadir',Jam:s.hadir?jam(s.jam):'',Petugas:s.oleh||''}));
const mkSheet=r=>{const w=XLSX.utils.json_to_sheet(r);w['!cols']=[{wch:5},{wch:14},{wch:32},{wch:13},{wch:11},{wch:28}];return w};
const fname=k=>String(k).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const tglF=()=>`${ev.y}-${ev.m}-${ev.d}`;

function vLap(){
  const cs=classes();
  if(!cs.includes(lapK))lapK=cs[0]||'';
  const s=stat(S),k=lapK?stat(ofKelas(lapK)):null;
  return `<div class="card"><h2>Laporan per kelas</h2>
   <p class="mut">Pilih kelas, lalu unduh laporan khusus kelas itu saja.</p>
   <label>Kelas</label>
   <select id="lapk" onchange="lapK=this.value;render()">${cs.map(c=>`<option value="${esc(c)}" ${c===lapK?'selected':''}>${esc(c)}</option>`).join('')||'<option value="">Belum ada data</option>'}</select>
   ${k?`<p class="mut" style="margin-top:8px">${esc(lapK)} · ${k.h} hadir dari ${k.t} siswa (${k.p}%)</p>`:''}
   <div class="flex" style="margin-top:14px"><button class="btn" onclick="xlsxKelas()" ${lapK?'':'disabled'}>Unduh Excel kelas</button><button class="btn alt" onclick="pdfKelas()" ${lapK?'':'disabled'}>Unduh PDF kelas</button></div></div>
  <div class="card"><h2>Semua siswa</h2>
   <p class="mut">Acara ${tgl()} · ${s.h} hadir dari ${s.t} siswa (${s.p}%) di ${cs.length} kelas. Satu file Excel berisi rekap, gabungan semua siswa, dan satu sheet per kelas.</p>
   <div class="flex" style="margin-top:14px"><button class="btn green" onclick="xlsxSemua()" ${S.length?'':'disabled'}>Unduh Semua Siswa (Excel)</button></div></div>`;
}
window.xlsxKelas=()=>{
  if(!lapK)return toast('Pilih kelas dulu');
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,mkSheet(rowsOf(ofKelas(lapK))),String(lapK).replace(/[\[\]*?\/\\:]/g,'-').slice(0,31));
  XLSX.writeFile(wb,`Absensi-BTS-${fname(lapK)}-${tglF()}.xlsx`);
};
window.xlsxSemua=()=>{
  if(!S.length)return toast('Belum ada data siswa');
  const wb=XLSX.utils.book_new(),used=new Set(['rekap kelas','semua siswa']);
  const sn=k=>{const b=String(k).replace(/[\[\]*?\/\\:]/g,'-').slice(0,31);let n=b,i=2;while(used.has(n.toLowerCase()))n=b.slice(0,28)+'-'+i++;used.add(n.toLowerCase());return n};
  const rk=classes().map(k=>{const x=stat(ofKelas(k));return{Kelas:k,Total:x.t,Hadir:x.h,'Belum hadir':x.b,Persen:x.p+'%'}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rk),'Rekap Kelas');
  XLSX.utils.book_append_sheet(wb,mkSheet(rowsOf(rows())),'Semua Siswa');
  classes().forEach(k=>XLSX.utils.book_append_sheet(wb,mkSheet(rowsOf(ofKelas(k))),sn(k)));
  XLSX.writeFile(wb,`Absensi-BTS-Semua-Siswa-${tglF()}.xlsx`);
};
window.pdfKelas=()=>{
  if(!lapK)return toast('Pilih kelas dulu');
  const l=ofKelas(lapK),s=stat(l),{jsPDF}=window.jspdf,d=new jsPDF();
  d.setFontSize(15);d.text(`Absensi BTS 2026 - Kelas ${lapK}`,14,16);
  d.setFontSize(10);d.text(`SMK Ki Hajar Dewantoro  |  Tanggal acara: ${tgl()}  |  Hadir ${s.h} / ${s.t} (${s.p}%)`,14,23);
  d.autoTable({startY:28,head:[['No','Nama','Status','Jam']],body:l.map((r,i)=>[i+1,r.nama,r.hadir?'Hadir':'Belum hadir',r.hadir?jam(r.jam):'-']),headStyles:{fillColor:[37,99,235]},styles:{fontSize:9}});
  d.save(`Absensi-BTS-${fname(lapK)}-${tglF()}.pdf`);
};

function vSet(){
  const yr=new Date().getFullYear(),ys=[yr-1,yr,yr+1,yr+2];
  const l=sq?S.filter(s=>(s.nama+s.kelas).toLowerCase().includes(sq.toLowerCase())).sort((a,b)=>nat(a.nama,b.nama)).slice(0,40):[];
  return `<div class="card"><h2>Tanggal acara</h2><div class="g3">
    <select id="sd">${Array.from({length:31},(_,i)=>`<option ${ev.d==i+1?'selected':''}>${i+1}</option>`).join('')}</select>
    <select id="sm">${BLN.map((b,i)=>`<option value="${i+1}" ${ev.m==i+1?'selected':''}>${b}</option>`).join('')}</select>
    <select id="sy">${ys.map(y=>`<option ${ev.y==y?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="flex" style="margin-top:12px"><button class="btn sm" onclick="saveTgl()">Simpan tanggal</button>
    <button class="btn sm ${ev.terkunci?'alt':'red'}" onclick="lockT()">${ev.terkunci?'🔓 Buka kunci absensi':'🔒 Kunci absensi'}</button></div></div>
  <div class="card"><h2>Impor data siswa</h2><p class="mut">File Excel/CSV dengan kolom <b>nama</b> dan <b>kelas</b>. Impor ulang tidak membuat data ganda.</p>
    <input type="file" id="fi" accept=".xlsx,.xls,.csv" style="margin-top:10px"><p id="imp" class="mut" style="margin-top:6px"></p></div>
  <div class="card"><h2>Hapus satu kelas</h2><p class="mut">Menghapus semua siswa di kelas itu beserta status hadirnya.</p>
    <div class="flex" style="margin-top:10px"><select id="dk" style="flex:1;min-width:160px"><option value="">Pilih kelas…</option>${classes().map(k=>`<option>${esc(k)}</option>`).join('')}</select>
    <button class="btn red sm" onclick="delKelas()">Hapus kelas</button></div></div>
  <div class="card"><h2>Edit data & koreksi</h2>
    <input id="sq" placeholder="Cari siswa untuk diedit…" value="${esc(sq)}" oninput="sq=this.value;render()">
    <div style="margin-top:6px">${l.map(s=>`<div class="row"><div class="n"><b>${esc(s.nama)}</b><small>${esc(s.kelas)} · ${s.hadir?'Hadir '+jam(s.jam):'Belum hadir'}</small></div>
      ${s.hadir?`<button class="btn alt sm" onclick="batal('${s.id}')">Batalkan</button>`:`<button class="btn alt sm" onclick="hadir('${s.id}')">Hadir</button>`}
      <button class="btn alt sm" onclick="edit('${s.id}')">Edit</button><button class="btn red sm" onclick="del('${s.id}')">Hapus</button></div>`).join('')}</div>
    <button class="btn alt sm" style="margin-top:10px" onclick="tambah()">+ Tambah siswa</button></div>`;
}
window.saveTgl=async()=>{await evRef.set({d:+$('#sd').value,m:+$('#sm').value,y:+$('#sy').value},{merge:true});toast('Tanggal disimpan')};
window.lockT=async()=>{if(confirm(ev.terkunci?'Buka kunci absensi?':'Kunci absensi? Panitia tidak bisa mengubah absensi lagi.'))await evRef.set({terkunci:!ev.terkunci},{merge:true})};
window.edit=async id=>{
  const s=S.find(x=>x.id===id),n=prompt('Nama:',s.nama);if(n===null)return;const k=prompt('Kelas:',s.kelas);if(k===null)return;
  try{await db.collection('siswa').doc(id).update({nama:n.trim(),kelas:k.trim()});toast('Tersimpan')}catch(e){toast('Gagal (absensi terkunci?)')}
};
window.del=async id=>{if(confirm('Hapus siswa ini?'))try{await db.collection('siswa').doc(id).delete()}catch(e){toast('Gagal (absensi terkunci?)')}};
window.tambah=async()=>{
  const n=prompt('Nama siswa:');if(!n)return;const k=prompt('Kelas:');if(!k)return;
  try{await db.collection('siswa').add({nama:n.trim(),kelas:k.trim(),hadir:false});toast('Siswa ditambahkan')}catch(e){toast('Gagal (absensi terkunci?)')}
};
window.delKelas=async()=>{
  const k=$('#dk').value;if(!k)return toast('Pilih kelas dulu');
  if(ev.terkunci)return toast('Absensi terkunci');
  const l=S.filter(s=>s.kelas===k);
  if(prompt(`Hapus ${l.length} siswa kelas ${k}? Ketik HAPUS untuk lanjut.`)!=='HAPUS')return;
  try{
    for(let i=0;i<l.length;i+=400){const b=db.batch();l.slice(i,i+400).forEach(s=>b.delete(db.collection('siswa').doc(s.id)));await b.commit()}
    toast(`${l.length} siswa dihapus`);
  }catch(e){toast('Gagal: '+e.code)}
};
document.addEventListener('change',async e=>{
  if(e.target.id!=='fi'||!e.target.files[0])return;
  const out=$('#imp');out.textContent='Membaca file…';
  try{
    const wb=XLSX.read(await e.target.files[0].arrayBuffer());
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const list=raw.map(r=>{const o={};for(const k in r)o[k.trim().toLowerCase()]=String(r[k]).trim();return{nama:o.nama||o['nama siswa']||'',kelas:o.kelas||''}}).filter(r=>r.nama&&r.kelas);
    if(!list.length){out.textContent='Tidak ada baris valid. Pastikan kolom "nama" dan "kelas".';return}
    if(!confirm(`Impor ${list.length} siswa?`))return;
    for(let i=0;i<list.length;i+=400){
      const b=db.batch();
      list.slice(i,i+400).forEach(r=>{const id=(r.kelas+'_'+r.nama).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,120);b.set(db.collection('siswa').doc(id),{nama:r.nama,kelas:r.kelas},{merge:true})});
      await b.commit();
    }
    out.textContent=`Berhasil impor ${list.length} siswa.`;
  }catch(err){out.textContent='Gagal impor: '+err.message}
  e.target.value='';
});
</script>
